<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="solarisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5CE8" />
      <stop offset="50%" stop-color="#1447B8" />
      <stop offset="100%" stop-color="#082878" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="128" height="128" rx="26" fill="url(#solarisBg)" />
  <rect x="2" y="2" width="124" height="124" rx="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  
  <!-- Text SOLARIS -->
  <text 
    x="64" 
    y="69" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#FFFFFF" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Arial Black', sans-serif" 
    font-weight="900" 
    font-size="22" 
    letter-spacing="1.5"
    filter="url(#shadow)"
  >SOLARIS</text>
</svg>
