name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: bash /home/usersolo/deploy.sh
          command_timeout: 25m

      - name: Verifikasi situs
        run: |
          html=$(curl -fsS https://solaris-solo.tech/)
          js=$(echo "$html" | grep -o '/assets/[^"]*\.js' | head -1)
          test -n "$js"
          curl -fsSI "https://solaris-solo.tech$js" | grep -qi 'content-type:.*javascript'
