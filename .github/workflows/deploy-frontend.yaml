
name: Deploy Frontend - React Vite

on:
  push:
    branches:
      - rdp
    paths:
      - 'telkom/**'
      - '.github/workflows/deploy-frontend.yaml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy React
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: telkom/package-lock.json

      # 3. Install dependencies
      - name: Install Dependencies
        working-directory: telkom
        run: npm ci

      # 4. Build React Vite
      - name: Build Production
        working-directory: telkom
        run: npm run build

      # 5. Validate build output
      - name: Validate Build
        run: |
          test -f telkom/dist/index.html
          echo "Frontend build berhasil."

      # 6. Deploy to InfinityFree
      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftp
          port: 21

          local-dir: telkom/dist/
          server-dir: /htdocs/

          state-name: .ftp-frontend-sync-state.json

          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

          dangerous-clean-slate: false
          log-level: standard
