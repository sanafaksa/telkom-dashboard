
name: Deploy Frontend - React Vite

on:
  push:
    branches:
      - solarisapp
    paths:
      - 'index.html'
      - 'assets/**'
      - 'favicon.svg'
      - 'pngwing.com.png'
      - 'telkom-brand*.png'
      - 'telkom-logo.png'
      - '.htaccess'
      - '.github/workflows/deploy-frontend.yaml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Static React Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare Frontend Deployment
        run: |
          mkdir -p deploy/frontend

          test -f index.html
          test -d assets

          cp index.html deploy/frontend/
          cp -r assets deploy/frontend/

          [ ! -f favicon.svg ] || cp favicon.svg deploy/frontend/
          [ ! -f pngwing.com.png ] || cp pngwing.com.png deploy/frontend/
          [ ! -f telkom-brand-white.png ] || cp telkom-brand-white.png deploy/frontend/
          [ ! -f telkom-brand.png ] || cp telkom-brand.png deploy/frontend/
          [ ! -f telkom-logo.png ] || cp telkom-logo.png deploy/frontend/
          [ ! -f .htaccess ] || cp .htaccess deploy/frontend/

      - name: Validate Frontend Deployment
        run: |
          test -f deploy/frontend/index.html
          test -d deploy/frontend/assets

          echo "Frontend deployment files validated."

      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftp
          port: 21

          local-dir: deploy/frontend/
          server-dir: /htdocs/

          state-name: .ftp-frontend-sync-state.json

          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/.env.*
            **/node_modules/**

          dangerous-clean-slate: false
          log-level: standard